[project]
name = "pap-agent-harness"
version = "0.1.0"
description = "A Strands agent over the platform's permissioned tools: reads, explains, proposes and requests; never approves or commands. Hard spend cap and a trace of every step."
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents[openai]==1.65.0",
    "pap-agent-tools",
]

[project.scripts]
pap-harness = "pap_agent_harness.__main__:main"

[tool.uv.sources]
pap-agent-tools = { path = "../agent-tools", editable = true }

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "mypy>=1.16,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_agent_harness"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
