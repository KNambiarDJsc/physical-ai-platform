[project]
name = "pap-agent-tools"
version = "0.1.0"
description = "Typed, read-only diagnostics tools over the platform API (MCP over stdio), plus one write that only records a proposal."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_agent_tools"]
