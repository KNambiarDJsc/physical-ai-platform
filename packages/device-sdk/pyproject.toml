[project]
name = "pap-device-sdk"
version = "0.1.0"
description = "Adapter SDK: discover devices and their capabilities, read properties, invoke actions."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_device_sdk"]
