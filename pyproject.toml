[project]
name = "physical-ai-platform"
version = "0.0.0"
description = "Workspace root (not a distributable package)."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/openmhs-bridge", "packages/device-sdk", "packages/agent-tools", "services/api"]
# Instrument runtimes are independent projects with their own locks (D-027): their pins never constrain the platform.
exclude = ["runtimes/*"]

[tool.uv.sources]
openmhs-bridge = { workspace = true }
pap-device-sdk = { workspace = true }
pap-agent-tools = { workspace = true }
pap-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.13",
  "mypy>=1.16,<2",
  "pgserver==0.1.4",
  "mujoco==3.17.0",
  "numpy==2.5.4",
  "types-jsonschema>=4.23,<5",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".engine", "apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S607", "T201"]
"examples/**" = ["S311"]  # seeded generator for synthetic demo data, not cryptography
"runtimes/**" = ["S311"]  # seeded noise of simulated instruments, not cryptography
# The real-ROS harness shells out to ros2/bash by name inside WSL (no PATH games) and prints long CLI lines.
"runtimes/ros-observer/tests_ros/**" = ["S603", "S607", "E501"]
"scripts/dev_stack.py" = ["E501"]  # catalog descriptions are single human-readable strings

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["\\.engine/", "tests/"]

[[tool.mypy.overrides]]
# boto3/botocore ship no type information; the S3 adapter wraps them behind the typed Storage interface.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = [
  "packages/openmhs-bridge/tests",
  "packages/device-sdk/tests",
  "packages/agent-tools/tests",
  "runtimes/ros-observer/tests",
  "services/api/tests",
]
markers = [
  "engine: runs the real pinned OpenMHS binary (OPENMHS_BIN); fails instead of skipping when PAP_REQUIRE_ENGINE=1",
]
