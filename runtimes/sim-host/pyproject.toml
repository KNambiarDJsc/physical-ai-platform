[project]
name = "pap-sim-host"
version = "0.1.0"
description = "A simulation host: serves the pap.simulation-host/1 contract (LabThings) in front of an operator's simulator. Simulation only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "labthings-fastapi==0.3.0",
    "jsonschema==4.26.0",
    "mcap>=1.6,<2",
    "mcap-ros2-support>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "mypy>=1.16,<2", "types-jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_sim_host"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
