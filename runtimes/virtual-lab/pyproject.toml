[project]
name = "pap-virtual-lab"
version = "0.1.0"
description = "Simulated laboratory instruments served as LabThings (W3C WoT) Things. Simulation only."
requires-python = ">=3.12,<3.13"
dependencies = ["labthings-fastapi==0.3.0"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap_virtual_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
