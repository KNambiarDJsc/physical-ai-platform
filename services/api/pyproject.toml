[project]
name = "pap-api"
version = "0.1.0"
description = "Physical AI Reliability Platform: API service and evaluation worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "openmhs-bridge",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "pyjwt[crypto]>=2.10,<3",
  "prometheus-client>=0.26.0,<0.27",
  "opentelemetry-api>=1.45.2,<1.46",
  "opentelemetry-sdk>=1.45.2,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46",
  "boto3==1.43.123",
  "botocore==1.43.123",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
